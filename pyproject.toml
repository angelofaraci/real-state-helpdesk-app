[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "real-state-helpdesk"
version = "0.1.0"
description = "Real estate helpdesk backend service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic[email]>=2,<3",
    "pydantic-settings==2.7.1",
    "argon2-cffi==23.1.0",
    "pyjwt==2.13.0",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "aiosmtplib==3.0.2",
    "pgvector==0.3.6",
    "psycopg[binary]==3.3.4",
    "joblib==1.5.3",
    "openai==2.54.0",
    "arq==0.28.0",
    "scikit-learn==1.6.1",
    "numpy>=1.26,<3",
    "tiktoken==0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
]
ml = [
    "sentence-transformers==3.4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
