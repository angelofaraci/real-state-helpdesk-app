name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Run tests
        run: pytest

      - name: Train stage-2 classifiers
        run: python scripts/train_classifier.py

      - name: Evaluate stage-2 classifiers (macro-F1 gate)
        run: python scripts/evaluate_classifier.py
