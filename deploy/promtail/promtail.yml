# Promtail configuration — stage 8 (devops), PR7.
#
# Standard `docker_sd_configs` pattern: Promtail discovers every container
# on the same Docker host via the Docker daemon socket and ships their
# stdout/stderr logs to Loki. `loki:3100` is the compose service name/port
# Loki listens on once PR11's compose file exists.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Container name, without Docker's leading slash, as the `container`
      # label — this is what dashboards/log queries filter on.
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service
