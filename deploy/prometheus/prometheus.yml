# Prometheus scrape configuration — stage 8 (devops), PR7.
#
# Service hostnames (`api`, `worker`, `postgres_exporter`, `node_exporter`)
# resolve via Docker Compose's internal DNS once the compose file lands in
# PR11 — this file is authored ahead of that so it's ready to mount as-is.
#
# Port notes:
#   - `api:8000`   — the FastAPI app's own `/metrics`, exposed by
#     `prometheus-fastapi-instrumentator` (wired in `app/main.py`).
#   - `worker:9200` — the arq worker process's `/metrics`
#     (`prometheus_client.start_http_server`, started in
#     `app.workers.settings.on_startup`). Deliberately NOT 9100: that's
#     `node_exporter`'s conventional default port, and both would be
#     scraped by this same Prometheus instance — see
#     `app/core/config.py`'s `worker_metrics_port` for the same note.
#   - `node_exporter:9100` — host/container OS metrics (PR9/10/11 scope;
#     referenced here by its conventional service name/port so this file
#     doesn't need to change again once that service exists).
#   - `postgres_exporter:9187` — Postgres metrics (PR9/10/11 scope;
#     9187 is `postgres_exporter`'s own conventional default port).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: worker
    static_configs:
      - targets: ["worker:9200"]
    metrics_path: /metrics

  - job_name: node_exporter
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: postgres_exporter
    static_configs:
      - targets: ["postgres_exporter:9187"]
